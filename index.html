<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>오디세이</title>
<meta name="description" content="트로이를 떠나 이타카로. 여덟 판, 일곱 보스 — 호메로스의 귀향을 쿼터뷰 로그라이크로." />
<meta name="theme-color" content="#05060a" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
<link rel="apple-touch-icon" href="/favicon-180.png" />
<meta property="og:type" content="website" />
<meta property="og:title" content="오디세이" />
<meta property="og:description" content="트로이를 떠나 이타카로. 여덟 판, 일곱 보스 — 호메로스의 귀향을 쿼터뷰 로그라이크로." />
<meta property="og:image" content="https://odyssey.41ways.workers.dev/favicon-512.png" />
<meta name="twitter:card" content="summary" />
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060a; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  #app { position:fixed; inset:0; }
  /* 커서. 겨누는 곳은 이것 하나로만 말한다 — 바닥에 조준점을 따로 그리면
     같은 자리에 겹쳐 둘 다 지저분해진다.
     threejsassets 의 Vesperfall 커서 묶음 (CREDITS.md). 48px 원본 그대로 쓴다. */
  canvas { display:block; width:100%; height:100%;
    cursor: url('/cursors/neutral.webp') 24 24, crosshair; }
  /* 적을 겨눌 때 · 누를 수 있을 때 · 못 하는 때 — 상태마다 다른 커서 */
  canvas.aim-hostile { cursor: url('/cursors/attack.webp') 24 24, crosshair; }
  canvas.aim-use     { cursor: url('/cursors/interact.webp') 24 24, pointer; }
  canvas.aim-blocked { cursor: url('/cursors/blocked.webp') 24 24, not-allowed; }
  canvas.aim-loot    { cursor: url('/cursors/loot.webp') 24 24, grab; }
  #ui { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .dmg { position:absolute; font-weight:800; font-variant-numeric:tabular-nums;
         text-shadow:0 2px 6px rgba(0,0,0,.9); will-change:transform,opacity; }

  /* 첫 그림 — 모델·텍스처를 다 받을 때까지 게임은 아무것도 안 그린다
     (main.js 의 Promise.all preload). 그동안 화면이 그냥 까맣기만 하면
     멈춘 페이지처럼 보인다. 자바스크립트를 기다릴 필요 없이 이 HTML만
     으로 바로 뜨도록 <head> 안에 인라인으로 둔다. */
  #boot { position:fixed; inset:0; z-index:999; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; background:#05060a;
    transition:opacity .5s ease; }
  #boot.gone { opacity:0; pointer-events:none; }
  #boot .ring { width:46px; height:46px; border-radius:50%;
    border:2px solid rgba(232,200,132,.18); border-top-color:#e8c884;
    animation:boot-spin 1s linear infinite; }
  #boot .word { font-family:"Apple SD Gothic Neo", serif; font-size:13px;
    letter-spacing:.4em; color:#a08549; padding-left:.4em; }
  @keyframes boot-spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="boot"><div class="ring"></div><div class="word">오디세이</div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
