<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>오디세이</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060a; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; cursor:none; }
  #ui { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .dmg { position:absolute; font-weight:800; font-variant-numeric:tabular-nums;
         text-shadow:0 2px 6px rgba(0,0,0,.9); will-change:transform,opacity; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
